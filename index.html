<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08080b">
    <meta name="description" content="Endless ambient radio. Turn the dial through eight universes of sound.">
    <title>Lost Codex</title>
    <link rel="preload" href="fonts/Basteleur-Moonlight.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/Compagnon-Roman.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="field" aria-hidden="true"></canvas>

    <div id="app">
        <header id="top">
            <span class="wordmark">Lost Codex</span>
            <div class="top-actions">
                <button id="scan" type="button" aria-pressed="false" title="Move to a new station every few minutes">Scan</button>
                <button id="power" type="button" aria-pressed="false">Power</button>
            </div>
        </header>

        <section id="station" aria-live="polite">
            <p id="freq" class="meta">—</p>
            <h1 id="name">Lost Codex</h1>
            <p id="blurb" class="blurb">Endless ambient radio across eight universes of sound.</p>
            <form id="code-form" autocomplete="off">
                <label for="code" class="sr-only">Station code</label>
                <input id="code" name="code" spellcheck="false" maxlength="24" enterkeyhint="go">
            </form>
            <p id="now" class="meta"></p>
        </section>

        <div id="dial-wrap">
            <canvas id="dial" role="slider" tabindex="0" aria-label="Tuning dial" aria-valuemin="0" aria-valuemax="95" aria-valuenow="0"></canvas>
            <div id="needle" aria-hidden="true"></div>
            <p id="hint" class="meta">Tap to power on, then turn the dial</p>
        </div>
    </div>

    <script type="module" src="src/web/app.js"></script>
</body>
</html>
