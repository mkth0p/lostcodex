<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07080c">
    <title>Lost Codex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="field" aria-hidden="true"></canvas>

    <main id="ui">
        <header>
            <h1>Lost Codex</h1>
            <p id="meta">Endless ambient music. Every code is its own piece.</p>
        </header>

        <section id="start">
            <button id="play" type="button">Listen</button>
        </section>

        <footer id="controls">
            <form id="code-form" autocomplete="off">
                <label for="code" class="sr-only">Code</label>
                <input id="code" name="code" maxlength="12" spellcheck="false" inputmode="text">
                <button type="submit" title="Play this code">Go</button>
            </form>
            <button id="next" type="button" title="Drift to a new code">Drift</button>
            <button id="pause" type="button" title="Pause">Pause</button>
            <button id="fullscreen" type="button" title="Fullscreen">Full</button>
        </footer>
        <p id="now" aria-live="polite"></p>
    </main>

    <script type="module" src="src/web/app.js"></script>
</body>
</html>
